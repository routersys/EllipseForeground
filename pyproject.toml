[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "ellipse-foreground"
version = "1.2.0"
requires-python = ">=3.11"
license = "BSD-3-Clause"
license-files = ["LICENSE.txt"]
authors = [{ name = "routersys" }]
dependencies = ["numpy>=2.0", "Pillow>=10.0", "scipy>=1.11"]

[project.optional-dependencies]
figures = ["matplotlib>=3.8"]
timing = ["PyMaxflow>=1.3"]
baselines = ["opencv-python-headless>=4.8", "torch>=2.2", "torchvision>=0.17", "segment-anything>=1.0"]
dev = ["pytest>=8.0", "ruff>=0.6"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -m 'not golden'"
markers = ["golden: ゴールデン検証。実行に数分かかるので -m golden で選ぶ"]

[tool.ruff]
line-length = 120
target-version = "py311"
src = ["src", "."]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF", "N", "C4", "ERA"]
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
"paper/**" = ["E501"]
